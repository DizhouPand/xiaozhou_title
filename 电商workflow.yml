        - id: 2281e31b-43e5-4bf5-aa1f-56d50a778431
          role: system
          text: '请判断下面这条营销文案是否命中以下任一红线：

            1. 对商品使用「最」「第一」「全网」「国家级」等绝对化用语；

            2. 出现「原价」「划线价」但没有说明比价依据；

            3. 推销商品却没有标明「广告」。


            判断类别的定义：

            - 有风险：文案对商品使用了绝对化用语、无依据的比价，或推销商品未标广告。正例：「S7 吸力行业第一」。

            - 安全：只陈述可核实的商品事实或使用体验，不含上述三条。正例：「S7 激光雷达导航，绕开拖鞋和数据线」。反例：「我们的目标是做用户信赖的清洁品牌」说的是经营目标、不指向具体商品、判安全。反例：「禾予滚刷免工具拆洗，三秒换好」是店铺自己发的种草标题，判安全；第3条只管装成普通用户分享、其实是推广却不标「广告」的软文。

            - 无法判断：信息不足、拿不准的，一律判无法判断，交给人工复核。


            文案：{{#1792725877418.text#}}

            只回答以下三个词之一：安全 / 有风险 / 无法判断。不要输出任何其他文字。'
        reasoning_format: separated
